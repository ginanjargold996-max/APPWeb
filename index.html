<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MandaGroup · PT Manda Grup Nusantara</title>

  <!-- ===== PWA meta ===== -->
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Portal keuangan PT Manda Grup Nusantara — kirim laporan, pantau review, kelola invoice.">
  <meta name="application-name" content="MandaGroup">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MandaGroup">
  <meta name="format-detection" content="telephone=no">

  <!-- ===== Manifest & ikon ===== -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href=".icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- ===== Fonts (BUG FIX: sebelumnya link ini tidak ada) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <!-- ===== App styles ===== -->
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app is-land" id="app"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <noscript>
    <p style="padding:24px;font:14px/1.5 system-ui;color:#000;background:#fff">
      Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.
    </p>
  </noscript>

  <!-- ===== App logic ===== -->
  <script src="app.js"></script>
  <!-- ===== PWA init (dipisah supaya tetap jalan walau app.js error) ===== -->
  <script src="pwa-init.js"></script>
</body>
</html>
